name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Python dependencies
        run: uv sync --frozen --extra api --python 3.12
      - name: Install frontend dependencies
        run: npm ci
        working-directory: web
      - name: Verify generated API types
        run: npm run api:check
        working-directory: web
      - name: Lint frontend
        run: npm run lint
        working-directory: web
      - name: Type-check frontend
        run: npm run typecheck
        working-directory: web
      - name: Test frontend
        run: npm test
        working-directory: web
      - name: Build frontend
        run: npm run build
        working-directory: web

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --extra api --extra dev
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy src
      - name: Test
        run: uv run pytest

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Install build Python
        run: uv python install 3.12
      - name: Build wheel and source distribution
        run: uv build --python 3.12
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
          retention-days: 1

  install:
    name: Install / Python ${{ matrix.python-version }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Install Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - name: Install built wheel
        run: python -m pip install --disable-pip-version-check dist/*.whl
      - name: Verify package import
        run: python -c "import nexolith; print(nexolith.__version__)"
      - name: Verify version output
        run: nexolith --version
      - name: Validate service-free pipeline
        run: nexolith validate examples/pipelines/completed_orders.yaml
      - name: Run service-free pipeline
        run: nexolith run examples/pipelines/completed_orders.yaml
