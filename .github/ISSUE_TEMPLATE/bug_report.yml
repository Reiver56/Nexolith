name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include a minimal sanitized pipeline and command.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Nexolith, Python, and operating system versions.
    validations:
      required: true
  - type: checkboxes
    id: security
    attributes:
      label: Security
      options:
        - label: This report contains no credentials or private vulnerability details.
          required: true

