[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexolith"
version = "0.3.0"
description = "A lightweight, modular framework for durable data pipelines."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "Apache-2.0" }
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "prompt_toolkit>=3.0,<4",
  "psutil>=7.2,<8",
  "pydantic>=2.10,<3",
  "PyYAML>=6.0,<7",
  "SQLAlchemy>=2.0,<3",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.121,<1",
  "uvicorn>=0.35,<1",
]
postgres = ["psycopg[binary]>=3.2,<4"]
dev = [
  "httpx2>=2.7,<3",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
  "twine>=7,<8",
  "types-psutil>=7.2,<8",
  "types-PyYAML>=6.0",
]

[project.scripts]
nexolith = "nexolith.cli.app:app"

[tool.hatch.build.targets.wheel]
packages = ["src/nexolith"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = ["postgres: requires the Docker Compose PostgreSQL service"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".uv-cache", ".uv-python"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["nexolith"]
mypy_path = "src"
