services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexolith}
      POSTGRES_USER: ${POSTGRES_USER:-nexolith}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexolith}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    volumes:
      - nexolith-postgres:/var/lib/postgresql/data

volumes:
  nexolith-postgres:
